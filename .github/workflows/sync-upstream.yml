name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Add upstream remote
        run: git remote add upstream https://github.com/AlaeddineMessadi/opencode-mcp.git
      - name: Fetch upstream
        run: git fetch upstream main --tags
      - name: Update upstream-tracking branch
        run: |
          git checkout -B upstream-tracking upstream/main
          git push origin upstream-tracking --force
      - name: Detect new upstream commits
        id: detect
        run: |
          NEW_COUNT=$(git rev-list --count main..upstream/main || echo 0)
          echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT
          if [ "$NEW_COUNT" -gt 0 ]; then
            echo "new_commits<<EOF" >> $GITHUB_OUTPUT
            git log --oneline main..upstream/main >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
      - name: Open sync issue if new commits
        if: steps.detect.outputs.new_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Upstream has ${{ steps.detect.outputs.new_count }} new commit(s) since our last sync:\n\n\`\`\`\n${{ steps.detect.outputs.new_commits }}\n\`\`\`\n\nRebase \`main\` on \`upstream-tracking\` and resolve any conflicts in \`vendor-patches\`.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[bot] Upstream sync available (${{ steps.detect.outputs.new_count }} commits)`,
              body,
              labels: ['upstream-sync']
            });
